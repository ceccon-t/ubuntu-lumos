name: Release Linux

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Linux packages and create draft release
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build AppImage and Debian package
        # Keep packaging separate from publishing: electron-builder otherwise
        # attempts an implicit GitHub publish when this workflow runs on a tag.
        run: npm run build:linux -- --publish never

      - name: Create draft GitHub release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
          files: |
            release/*.AppImage
            release/*.deb
